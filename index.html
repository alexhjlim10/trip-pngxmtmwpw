<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2f7563">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>나고야 여행</title>
<style>
:root { --bg: #eef1ee; --surface: #ffffff; --ink: #1b2320; --muted: #5f6b66; --line: #d9dfdb; --accent: #2f7563; --accent-ink: #ffffff; --warn: #b4441f; }
@media (prefers-color-scheme: dark) { :root { --bg: #121715; --surface: #1a211e; --ink: #e5ebe8; --muted: #95a39d; --line: #2d3733; --accent: #5cb39d; --accent-ink: #0d1412; --warn: #f08a66; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 21px; }
p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
input[type=password], input[type=text] { width: 100%; font-size: 17px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
label.rem { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
button { font-size: 17px; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--warn); font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>나고야 여행 12/27–12/31</h1>
  <p>가족끼리만 보는 페이지예요. 받은 비밀번호를 입력하세요.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호" required>
  <label class="rem"><input id="rem" type="checkbox" checked> 이 폰에서 비밀번호 기억하기</label>
  <button id="go" type="submit">열기</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(function () {
  "use strict";
  var KEY = "ngy-trip-pw";
  var form = document.getElementById("f"), pwEl = document.getElementById("pw"), err = document.getElementById("err"), btn = document.getElementById("go");
  var dataPromise = null;
  function loadData() { if (!dataPromise) dataPromise = fetch("data.bin", { cache: "force-cache" }).then(function (r) { if (!r.ok) throw new Error("load"); return r.arrayBuffer(); }); return dataPromise; }
  async function open(pw, remember) {
    btn.disabled = true; err.textContent = ""; btn.textContent = "여는 중… (처음엔 조금 걸려요)";
    try {
      var buf = new Uint8Array(await loadData());
      var salt = buf.slice(0, 16), iv = buf.slice(16, 32), ct = buf.slice(32);
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-CBC", length: 256 }, false, ["decrypt"]);
      var plain;
      try { plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, key, ct); } catch (e) { throw new Error("pw"); }
      var html = new TextDecoder().decode(plain);
      if (html.slice(0, 6) !== "NGYOK:") throw new Error("pw");
      try { if (remember) localStorage.setItem(KEY, pw); else localStorage.removeItem(KEY); } catch (e) {}
      document.open(); document.write(html.slice(6)); document.close();
    } catch (e) {
      try { localStorage.removeItem(KEY); } catch (x) {}
      err.textContent = e.message === "pw" ? "비밀번호가 맞지 않아요. 다시 입력해 주세요." : "페이지를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
      if (e.message !== "pw") dataPromise = null;
      btn.disabled = false; btn.textContent = "열기";
    }
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); open(pwEl.value.trim(), document.getElementById("rem").checked); });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { pwEl.value = saved; open(saved, true); } else { loadData().catch(function () {}); }
})();
</script>
</body>
</html>
